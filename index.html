<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Pims Puzzelpolder: een 3D Zweedse puzzel voor kinderen vanaf 7 jaar.">
<meta name="theme-color" content="#1E3C96">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Pims Puzzelpolder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Grandstander:wght@600;800;900&display=swap">
<style>
:root{
  /* Layout: full-bleed 3D tabletop with a floating HUD, docked on a Delft-blue control deck */
  --sky:#BFE6FF;
  --deck:#1E3C96; --deck-deep:#122A6E; --deck-line:rgba(255,255,255,.07);
  --paper:#FFFFFF; --paper-2:#EAF0FF; --ink:#13235E; --ink-soft:#4F5F93;
  --oranje:#FF8A1F; --oranje-deep:#C9620A; --kaas:#FFC93C; --kaas-deep:#C9900A; --tulp:#E8423F; --gras:#2FA45A;
  --f-display:"Grandstander","Trebuchet MS","Comic Sans MS",system-ui,sans-serif;
  --f-read:"Andika","Verdana",system-ui,sans-serif;
  color-scheme:light;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--deck);color:var(--ink);font-family:var(--f-read);overflow:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--kaas);outline-offset:2px}
svg{display:block}

#app{height:100%;display:flex;flex-direction:column}
#stage{position:relative;flex:1 1 auto;min-height:0;background:var(--sky);overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}

/* HUD */
#hud{position:absolute;top:0;left:0;right:0;z-index:3;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding-top:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
#hud>*{pointer-events:auto}
.chip{background:var(--paper);border-radius:999px;box-shadow:0 3px 0 rgba(19,35,94,.16),0 8px 20px rgba(19,35,94,.12)}
.lvl{display:flex;align-items:center;gap:9px;padding:5px 14px 5px 5px;min-width:0}
.lvl-num{width:42px;height:42px;flex:0 0 42px;border-radius:50%;display:grid;place-items:center;background:var(--oranje);color:#fff;font:900 22px/1 var(--f-display);box-shadow:inset 0 -4px 0 var(--oranje-deep);font-variant-numeric:tabular-nums}
.lvl-meta{display:flex;flex-direction:column;gap:4px;min-width:0}
.lvl-lbl{font:800 11px/1 var(--f-display);text-transform:uppercase;letter-spacing:.1em;color:var(--ink-soft);max-width:clamp(74px,22vw,170px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xp{width:clamp(74px,22vw,170px);height:10px;border-radius:99px;background:var(--paper-2);overflow:hidden;box-shadow:inset 0 1px 2px rgba(19,35,94,.22)}
.xp i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--kaas),var(--oranje));transition:width .7s cubic-bezier(.3,1.3,.5,1)}
.xp-txt{font:700 11px/1 var(--f-read);color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.hud-right{display:flex;gap:7px;align-items:center}
.coins{display:flex;align-items:center;gap:6px;padding:5px 13px 5px 5px;font:900 19px/1 var(--f-display);font-variant-numeric:tabular-nums}
.coins .ico-coin{width:30px;height:30px}
.coins.bump{animation:bump .45s ease}
@keyframes bump{30%{transform:scale(1.18)}}
.hbtn{display:flex;align-items:center;gap:6px;height:40px;padding:0 13px;border:0;font:800 15px/1 var(--f-display)}
.hbtn svg{width:22px;height:22px}
.hbtn.sq{width:40px;padding:0;justify-content:center}
.hbtn.muted{color:#9AA3C2}
@media (max-width:430px){.hbtn .lbl{display:none}.hbtn{width:40px;padding:0;justify-content:center}.lvl{padding-right:11px}}

/* Pim's speech bubble */
#bubble{position:absolute;left:0;top:0;z-index:2;max-width:min(230px,58vw);background:var(--paper);color:var(--ink);font:800 15px/1.28 var(--f-display);padding:10px 14px;border-radius:18px;box-shadow:0 4px 0 rgba(19,35,94,.15),0 10px 24px rgba(19,35,94,.18);pointer-events:none;text-wrap:balance}
#bubble::after{content:"";position:absolute;width:14px;height:14px;background:var(--paper);transform:rotate(45deg);border-radius:3px}
#bubble[data-tail="up"]::after{bottom:-6px;left:calc(var(--tx,50%) - 7px)}
#bubble[data-tail="side"]::after{right:-6px;top:calc(50% - 7px)}

#fx{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.float{position:absolute;font:900 24px/1 var(--f-display);color:#fff;white-space:nowrap;text-shadow:0 3px 0 var(--deck),0 0 2px var(--deck),0 6px 14px rgba(19,35,94,.35);animation:floatUp 1.3s cubic-bezier(.2,.9,.3,1) forwards}
.float.coin{color:var(--kaas)}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}14%{opacity:1;transform:translate(-50%,-70%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-300%) scale(1)}}

/* Deck */
#deck{flex:0 0 auto;position:relative;z-index:4;margin-top:-24px;border-radius:26px 26px 0 0;background-color:var(--deck);
  background-image:radial-gradient(circle at 0 0,var(--deck-line) 0 7px,transparent 8px),radial-gradient(circle at 100% 0,var(--deck-line) 0 7px,transparent 8px),radial-gradient(circle at 0 100%,var(--deck-line) 0 7px,transparent 8px),radial-gradient(circle at 100% 100%,var(--deck-line) 0 7px,transparent 8px),radial-gradient(circle at 50% 50%,var(--deck-line) 0 3px,transparent 4px);
  background-size:38px 38px;box-shadow:0 -8px 24px rgba(19,35,94,.28);padding-block:12px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.deck-in{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
#clue{display:flex;align-items:center;gap:11px;background:var(--paper);border-radius:18px;padding:7px 8px 7px 7px;box-shadow:inset 0 -4px 0 var(--paper-2)}
#cluePic{width:60px;height:60px;flex:0 0 60px;border-radius:13px;background:var(--paper-2)}
.clue-txt{flex:1;min-width:0}
#clueHint{margin:0;font:700 17px/1.25 var(--f-read);color:var(--ink);text-wrap:balance}
.clue-meta{margin:4px 0 0;display:flex;gap:6px;align-items:center;font:800 12px/1 var(--f-display);color:var(--ink-soft);text-transform:uppercase;letter-spacing:.07em}
.clue-meta svg{width:16px;height:16px;color:var(--oranje)}
.clue-meta .ok{color:var(--gras)}
.rbtn{width:46px;height:46px;flex:0 0 46px;border:0;border-radius:14px;display:grid;place-items:center;background:var(--paper-2);color:var(--ink);box-shadow:0 3px 0 #C9D4F3;position:relative}
.rbtn svg{width:26px;height:26px}
.rbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #C9D4F3}
.rbtn.tip{background:var(--kaas);box-shadow:0 3px 0 var(--kaas-deep);color:var(--ink)}
.rbtn.tip:disabled{opacity:.45;cursor:default}
.rbtn .badge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:10px;background:var(--tulp);color:#fff;font:900 12px/20px var(--f-display);text-align:center;padding:0 5px;box-shadow:0 2px 0 rgba(0,0,0,.15)}

#keys{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;min-height:118px}
#keys.bank{flex-direction:row;flex-wrap:wrap;align-content:center;gap:8px}
.krow{display:flex;gap:5px;justify-content:center;width:100%}
.key{flex:1 1 0;max-width:46px;height:48px;padding:0;border:0;border-radius:10px;background:var(--paper);color:var(--ink);font:700 21px/1 var(--f-read);box-shadow:0 4px 0 var(--deck-deep);display:grid;place-items:center;transition:transform .06s}
.key svg{width:24px;height:24px}
.key.wide{max-width:66px;flex:1.5 1 0;background:#C9D6FF}
.key.down,.key:active{transform:translateY(3px);box-shadow:0 1px 0 var(--deck-deep)}
#keys.bank .key{flex:0 0 auto;width:54px;height:54px;max-width:none;border-radius:15px;font-size:27px;background:var(--kc,#fff);box-shadow:0 5px 0 var(--deck-deep)}
#keys.bank .key.del{background:#C9D6FF;width:66px}
#keys.bank .key.down,#keys.bank .key:active{transform:translateY(4px);box-shadow:0 1px 0 var(--deck-deep)}

.deck-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:flex;background:var(--deck-deep);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:#C9D6FF;border-radius:999px;padding:7px 12px;font:800 13px/1 var(--f-display)}
.seg button small{font-size:11px;color:var(--kaas);margin-left:3px}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
.seg button[aria-pressed="true"] small{color:var(--oranje-deep)}
.ghost{border:0;background:transparent;color:#fff;font:800 14px/1 var(--f-display);padding:7px 4px;display:flex;align-items:center;gap:4px}
.ghost svg{width:18px;height:18px}

/* Wardrobe sheet */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;max-height:min(66%,580px);display:flex;flex-direction:column;background:var(--paper);border-radius:26px 26px 0 0;box-shadow:0 -12px 40px rgba(19,35,94,.32);padding-top:14px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));animation:sheetIn .3s cubic-bezier(.2,1.2,.4,1)}
@keyframes sheetIn{from{transform:translateY(40%);opacity:0}}
.sheet-head,.tabs,#itemGrid{width:100%;max-width:760px;margin-left:auto;margin-right:auto}
.sheet-head{display:flex;align-items:center;gap:10px}
.sheet-head h2{margin:0;flex:1;font:900 26px/1 var(--f-display);color:var(--ink)}
.sheet-head .coins{box-shadow:none;background:var(--paper-2)}
.btn{border:0;border-radius:16px;padding:12px 20px;font:900 18px/1 var(--f-display);background:var(--paper-2);color:var(--ink);box-shadow:0 4px 0 #C9D4F3}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #C9D4F3}
.btn.primary{background:var(--oranje);color:#fff;box-shadow:0 5px 0 var(--oranje-deep)}
.btn.primary:active{box-shadow:0 1px 0 var(--oranje-deep)}
.btn.small{padding:9px 14px;font-size:15px;border-radius:13px}
.tabs{display:flex;gap:6px;margin-top:12px;margin-bottom:10px;overflow-x:auto;scrollbar-width:none}
.tab{flex:1 0 auto;border:0;border-radius:12px;padding:9px 12px;background:var(--paper-2);color:var(--ink-soft);font:800 15px/1 var(--f-display)}
.tab[aria-selected="true"]{background:var(--deck);color:#fff}
#itemGrid{flex:1 1 auto;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;padding:4px 2px 6px;align-content:start}
.item{border:3px solid transparent;border-radius:18px;background:var(--paper-2);padding:8px 6px 9px;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;position:relative}
.item.on{border-color:var(--oranje);background:#FFF2E3}
.ithumb{width:76px;height:76px;position:relative;display:grid;place-items:center}
.ithumb img{width:76px;height:76px;object-fit:contain}
.ithumb .ph{width:56px;height:56px;border-radius:50%;background:#DDE5FB}
.wthumb{width:72px;height:72px;border-radius:16px;display:grid;place-items:center;font-size:34px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.item.locked .ithumb>*:not(.lockb){filter:grayscale(1) brightness(1.1);opacity:.45}
.lockb{position:absolute;right:2px;bottom:2px;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center}
.lockb svg{width:14px;height:14px}
.iname{font:800 14px/1.1 var(--f-display);color:var(--ink)}
.istat{font:800 12px/1 var(--f-display);border-radius:99px;padding:5px 9px;background:var(--paper);color:var(--ink-soft);display:flex;align-items:center;gap:4px}
.istat svg{width:15px;height:15px}
.item.on .istat{background:var(--oranje);color:#fff}
.item.shop .istat{background:var(--kaas);color:var(--ink)}
.item.shop.poor .istat{background:#E3E7F3;color:#8A93B3}
.item.confirm .istat{background:var(--gras);color:#fff}
.item.nope{animation:nope .4s}
@keyframes nope{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}

/* Modal */
#modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(14,26,72,.55);padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.mcard{width:min(400px,100%);max-height:100%;overflow-y:auto;background:var(--paper);border-radius:28px;padding:26px 22px 22px;text-align:center;box-shadow:0 10px 0 rgba(19,35,94,.25),0 30px 60px rgba(0,0,0,.25);animation:pop .45s cubic-bezier(.2,1.5,.4,1);display:flex;flex-direction:column;align-items:center;gap:12px}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.mcard h2{margin:0;font:900 32px/1.05 var(--f-display);color:var(--ink);text-wrap:balance}
.mcard p{margin:0;font:700 16px/1.35 var(--f-read);color:var(--ink-soft)}
.stars{display:flex;gap:8px;justify-content:center}
.stars svg{width:62px;height:62px;fill:#E1E6F5;transition:transform .3s}
.stars svg:nth-child(2){transform:translateY(-12px)}
.stars svg.on{fill:var(--kaas);filter:drop-shadow(0 3px 0 var(--kaas-deep));animation:starIn .45s cubic-bezier(.2,1.6,.4,1)}
.stars svg:nth-child(2).on{animation-name:starIn2}
@keyframes starIn{from{transform:scale(.2) rotate(-40deg)}}
@keyframes starIn2{from{transform:translateY(-12px) scale(.2) rotate(-40deg)}}
.rewards{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.rw{display:flex;align-items:center;gap:6px;background:var(--paper-2);border-radius:99px;padding:7px 14px 7px 8px;font:900 18px/1 var(--f-display);color:var(--ink)}
.rw svg{width:24px;height:24px}
.rw .xpdot{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--kaas),var(--oranje));color:#fff;font-size:10px;display:grid;place-items:center}
.lvbadge{width:96px;height:96px;border-radius:50%;background:var(--oranje);color:#fff;display:grid;place-items:center;font:900 52px/1 var(--f-display);box-shadow:inset 0 -8px 0 var(--oranje-deep),0 0 0 10px #FFE7CF;animation:spinIn .7s cubic-bezier(.2,1.4,.4,1)}
@keyframes spinIn{from{transform:scale(.3) rotate(-200deg)}}
.unlocks{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;width:100%}
.unlock{background:var(--paper-2);border-radius:18px;padding:10px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:130px}
.unlock .new{font:900 11px/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:#fff;background:var(--tulp);border-radius:99px;padding:4px 8px}
.unlock b{font:900 17px/1 var(--f-display);color:var(--ink)}
.unlock .ithumb{width:84px;height:84px}
.unlock .ithumb img{width:84px;height:84px}
/* Start menu: players + scoreboard */
#menu{position:fixed;inset:0;z-index:25;display:grid;place-items:center;background:rgba(14,26,72,.42);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.menu-card{width:min(440px,100%);max-height:100%;overflow-y:auto;background:var(--paper);border-radius:28px;padding:20px 18px 18px;box-shadow:0 10px 0 rgba(19,35,94,.25),0 30px 60px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:14px;animation:pop .45s cubic-bezier(.2,1.5,.4,1)}
.menu-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
#menuBody{display:flex;flex-direction:column;gap:16px}
.logo{display:flex;flex-direction:column;gap:5px;min-width:0}
.logo-pims{align-self:flex-start;background:var(--oranje);color:#fff;font:900 16px/1 var(--f-display);padding:6px 12px;border-radius:99px;transform:rotate(-4deg);box-shadow:0 3px 0 var(--oranje-deep);margin-bottom:2px}
.logo-row{display:flex;gap:4px}
.logo-row span{width:clamp(30px,8.4vw,40px);aspect-ratio:1;display:grid;place-items:center;border-radius:8px;background:#F2D2A2;color:#5B3A1D;font:900 clamp(18px,5vw,24px)/1 var(--f-display);box-shadow:inset 0 -4px 0 rgba(110,69,38,.3)}
.logo-row span:nth-child(odd){transform:rotate(-3deg)}
.logo-row span:nth-child(3n){background:#C88A4E;color:#FFF4E2}
.menu-top .hbtn{box-shadow:none;background:var(--paper-2);flex:0 0 auto}
.mtabs{display:flex;background:var(--paper-2);border-radius:14px;padding:4px;gap:4px}
.mtabs button{flex:1;border:0;background:transparent;border-radius:11px;padding:10px;font:800 16px/1 var(--f-display);color:var(--ink-soft)}
.mtabs button[aria-selected="true"]{background:var(--deck);color:#fff}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;align-items:center;gap:6px}
.pcard{flex:1;min-width:0;display:flex;align-items:center;gap:12px;border:3px solid transparent;border-radius:18px;background:var(--paper-2);padding:8px 10px 8px 8px;text-align:left;box-shadow:0 3px 0 #C9D4F3}
.pcard.cur{border-color:var(--oranje);background:#FFF2E3}
.pcard:active{transform:translateY(2px);box-shadow:0 1px 0 #C9D4F3}
.ava{width:48px;height:48px;flex:0 0 48px;border-radius:50%;display:grid;place-items:center;font:900 22px/1 var(--f-display);color:var(--ink);box-shadow:inset 0 -4px 0 rgba(0,0,0,.14)}
.pinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.pname{font:900 19px/1.1 var(--f-display);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pmeta{font:700 13px/1.25 var(--f-read);color:var(--ink-soft)}
.pgo{width:36px;height:36px;flex:0 0 36px;border-radius:50%;background:var(--oranje);color:#fff;display:grid;place-items:center;box-shadow:inset 0 -3px 0 var(--oranje-deep)}
.pgo svg{width:16px;height:16px}
.pdel{height:40px;min-width:40px;flex:0 0 auto;border:0;border-radius:12px;background:transparent;color:#9AA3C2;display:grid;place-items:center;padding:0 8px}
.pdel svg{width:20px;height:20px}
.pdel.sure{background:var(--tulp);color:#fff;font:800 13px/1 var(--f-display)}
.newp{display:flex;flex-direction:column;gap:8px;padding-top:2px}
.newp label{font:900 18px/1 var(--f-display);color:var(--ink)}
.newp .row{display:flex;gap:8px}
.newp input{flex:1;min-width:0;border:3px solid #DCE4FA;border-radius:14px;padding:11px 14px;font:700 18px/1.1 var(--f-read);color:var(--ink);background:#fff;outline:none;-webkit-user-select:text;user-select:text}
.newp input:focus{border-color:var(--deck)}
.err{margin:0;min-height:1.2em;font:700 14px/1.2 var(--f-read);color:var(--tulp)}
.menu-foot{display:flex;justify-content:center}
.board-list{display:flex;flex-direction:column;gap:6px}
.srow{display:grid;grid-template-columns:32px minmax(0,1fr) auto auto;align-items:center;gap:10px;padding:8px 12px 8px 8px;border-radius:14px;background:var(--paper-2);border:0;text-align:left;width:100%}
.srow.cur{background:#FFF2E3;box-shadow:inset 0 0 0 2px var(--oranje)}
.medal{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:900 15px/1 var(--f-display);background:#DDE5FB;color:var(--ink)}
.medal.m1{background:#FFC93C;box-shadow:inset 0 -3px 0 #C9900A}.medal.m2{background:#D3DCEC;box-shadow:inset 0 -3px 0 #9EABC4}.medal.m3{background:#E8A774;box-shadow:inset 0 -3px 0 #B9733F}
.sname{min-width:0;font:900 16px/1.15 var(--f-display);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sname small{display:block;font:700 12px/1.25 var(--f-read);color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis}

</div>

</div>

/* ================= GENERATOR ================= */
function generate(level){
  const N=level<=2?7:level<=5?8:9;
  const maxLen=level<=2?4:level<=5?5:level<=8?6:7;
  const target=level<=2?6:level<=5?8:level<=8?10:12;
  const recent=new Set(S.recent||[]);
  const pool=WORDS.filter(w=>w.w.length>=3&&w.w.length<=maxLen);
  let best=null;const t0=performance.now();let n=0;
  while(n<300&&(performance.now()-t0<220||!best||best.words.length<3)){
    n++;
    const order=shuffle(pool.filter(w=>!recent.has(w.w))).concat(shuffle(pool.filter(w=>recent.has(w.w))));
    const res=buildGrid(N,order,target);
    res.sc=res.words.length*100+res.letters;
    if(!best||res.sc>best.sc)best=res;
    if(res.words.length>=target)break;
    if(performance.now()-t0>1500)break;
  }
  return crop(best);
}
function buildGrid(N,order,target){
  const g=new Array(N*N).fill(null),words=[],used=new Set();
  const at=(r,c)=>(r<0||c<0||r>=N||c>=N)?undefined:g[r*N+c];
  const isL=(r,c)=>{const x=at(r,c);return !!x&&x.t==='L';};
  function check(w,r,c,dir){
    const dr=dir==='v'?1:0,dc=1-dr,L=w.length;
    const cr=r-dr,cc=c-dc;if(cr<0||cc<0)return -1;
    const lr=r+dr*(L-1),lc=c+dc*(L-1);if(lr>=N||lc>=N)return -1;
    const after=at(lr+dr,lc+dc);if(after&&after.t==='L')return -1;
    const cl=at(cr,cc);if(cl){if(cl.t==='L')return -1;if(cl[dir]!=null)return -1;}
    let cross=0;
    for(let i=0;i<L;i++){
      const rr=r+dr*i,c2=c+dc*i,x=at(rr,c2);
      if(x){if(x.t!=='L'||x.ch!==w[i]||x[dir]!=null)return -1;cross++;}
      else if(dir==='h'?(isL(rr-1,c2)||isL(rr+1,c2)):(isL(rr,c2-1)||isL(rr,c2+1)))return -1;
    }
    if(cross===L)return -1;
    return cross+(cl?.6:0);
  }
  function place(wo,r,c,dir){
    const dr=dir==='v'?1:0,dc=1-dr,wi=words.length;
    const k0=(r-dr)*N+(c-dc);let cl=g[k0];if(!cl){cl={t:'C',h:null,v:null};g[k0]=cl;}cl[dir]=wi;
    for(let i=0;i<wo.w.length;i++){const k=(r+dr*i)*N+(c+dc*i);let x=g[k];if(!x){x={t:'L',ch:wo.w[i],h:null,v:null};g[k]=x;}x[dir]=wi;}
    words.push({w:wo.w,r,c,dir});used.add(wo.w);
  }
  const first=order.find(w=>w.w.length>=Math.min(4,N-3))||order[0];
  const L0=first.w.length,dir0=Math.random()<.5?'h':'v';
  const off=1+Math.floor(Math.random()*(N-1)),st=1+Math.floor(Math.random()*Math.max(1,N-L0));
  if(dir0==='h')place(first,off,st,'h');else place(first,st,off,'v');
  let guard=0;
  while(words.length<target&&guard++<40){
    let bestOpt=null,found=0;
    for(const wo of order){
      if(used.has(wo.w))continue;
      let top=null;
      for(const dir of ['h','v'])for(let r=0;r<N;r++)for(let c=0;c<N;c++){const s=check(wo.w,r,c,dir);if(s>=1){const sc=s+Math.random()*.9;if(!top||sc>top.s)top={wo,r,c,dir,s:sc};}}
      if(top){if(!bestOpt||top.s>bestOpt.s)bestOpt=top;if(++found>=3)break;}
    }
    if(!bestOpt)break;
    place(bestOpt.wo,bestOpt.r,bestOpt.c,bestOpt.dir);
  }
  let letters=0;g.forEach(x=>{if(x&&x.t==='L')letters++;});
  return{N,g,words,letters};
}
function crop(res){
  const{N,g,words}=res;let r0=N,r1=-1,c0=N,c1=-1;
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(g[r*N+c]){r0=Math.min(r0,r);r1=Math.max(r1,r);c0=Math.min(c0,c);c1=Math.max(c1,c);}
  const W=c1-c0+1,H=r1-r0+1,cells=[];
  for(let r=0;r<H;r++)for(let c=0;c<W;c++){const x=g[(r+r0)*N+(c+c0)];cells.push(x?{t:x.t,ch:x.ch||'',h:x.h,v:x.v}:{t:'F',ch:'',h:null,v:null});}
  return{W,H,cells,words:words.map(w=>({w:w.w,r:w.r-r0,c:w.c-c0,dir:w.dir}))};
}
function makePuzzle(def){
  const{W,H}=def;
  const cells=def.cells.map((c,i)=>({i,r:Math.floor(i/W),c:i%W,t:c.t,ch:c.ch,h:c.h,v:c.v}));
  const words=def.words.map((w,idx)=>{const d=DICT[w.w]||{e:'⭐',h:'Raad het woord!'};const dr=w.dir==='v'?1:0,dc=1-dr;const list=[];for(let k=0;k<w.w.length;k++)list.push((w.r+dr*k)*W+(w.c+dc*k));return{idx,w:w.w,e:d.e,hint:d.h,r:w.r,c:w.c,dir:w.dir,cells:list,clue:(w.r-dr)*W+(w.c-dc)};});
  const order=words.slice().sort((a,b)=>(a.clue-b.clue)||(a.dir==='h'?-1:1)).map(w=>w.idx);
  const fillers=cells.filter(c=>c.t==='F').map(c=>c.i);
  const coins=def.coins||shuffle(fillers.slice()).slice(0,Math.min(2,fillers.length));
  return{W,H,cells,words,order,vals:def.vals||new Array(W*H).fill(''),wrong:new Array(W*H).fill(false),solved:def.solved||words.map(()=>false),mistakes:def.mistakes||0,hints:def.hints||0,coins,taken:def.taken||[],score:def.score||0,bank:{},done:false,uid:Math.random().toString(36).slice(2,8)};
}
function packPuzzle(){if(!P)return null;return{W:P.W,H:P.H,cells:P.cells.map(c=>({t:c.t,ch:c.ch,h:c.h,v:c.v})),words:P.words.map(w=>({w:w.w,r:w.r,c:w.c,dir:w.dir})),vals:P.vals,solved:P.solved,mistakes:P.mistakes,hints:P.hints,coins:P.coins,taken:P.taken,score:P.score};}

function selectWord(wi){const w=P.words[wi];if(!w)return;sel.dir=w.dir;
  let t=w.cells.find(k=>!P.vals[k]&&!cellSolved(k));if(t==null)t=w.cells.find(k=>P.wrong[k]);if(t==null)t=w.cells.find(k=>!cellSolved(k));if(t==null)t=w.cells[0];sel.i=t;refresh();}
function selectNextWord(from,backward){const ord=P.order,n=ord.length;const pos=ord.indexOf(from);for(let s=1;s<=n;s++){const wi=ord[(((pos+(backward?-s:s))%n)+n)%n];if(!P.solved[wi]){selectWord(wi);return;}}}
function tapCell(i,dz){
  const c=P.cells[i];
  if(c.t==='C'){let wi;if(c.h!=null&&c.v!=null)wi=dz<0?c.h:c.v;else wi=c.h!=null?c.h:c.v;Sfx.tap();selectWord(wi);if(P.solved[wi])say('Die heb je al gevonden!',1800);return;}
  if(c.t==='L'){const hO=c.h!=null&&!P.solved[c.h],vO=c.v!=null&&!P.solved[c.v];
    if(!hO&&!vO){tiles[i].wig=0;Sfx.tap();return;}
    if(sel.i===i){if(sel.dir==='h'&&vO)sel.dir='v';else if(sel.dir==='v'&&hO)sel.dir='h';}
    else{sel.i=i;if(sel.dir==='h'&&!hO)sel.dir='v';else if(sel.dir==='v'&&!vO)sel.dir='h';}
    Sfx.tap();refresh();return;}

}
function nextOpen(w,i,incl){const pos=w.cells.indexOf(i),n=w.cells.length;for(let s=incl?0:1;s<=n;s++){const k=w.cells[(pos+s)%n];if(!P.vals[k]&&!cellSolved(k))return k;}return null;}
const correct=w=>w.cells.every((k,j)=>P.vals[k]===w.w[j]);
function enterLetter(ch,viaTip,at){
  if(!P||P.done)return;const w=activeWord();if(!w||P.solved[w.idx])return;
  let i=at!=null?at:sel.i;
  if(cellSolved(i)){const nx=nextOpen(w,i,true);if(nx==null)return;i=nx;}
  sel.i=i;P.vals[i]=ch;P.wrong[i]=false;tiles[i].pop=0;if(!viaTip)Sfx.key();
  const full=w.cells.every(k=>P.vals[k]);
  if(full){
    if(correct(w))solveWord(w);
    else{P.mistakes++;w.cells.forEach(k=>{if(P.vals[k]!==P.cells[k].ch){P.wrong[k]=true;tiles[k].wig=0;}});Sfx.bad();pimShake();say(pick1(OOPS));const f=w.cells.find(k=>P.wrong[k]);if(f!=null)sel.i=f;}
  }else{const nx=nextOpen(w,i,false);if(nx!=null)sel.i=nx;}
  const oi=P.cells[i][w.dir==='h'?'v':'h'];
  if(oi!=null&&!P.solved[oi]){const ow=P.words[oi];if(ow.cells.every(k=>P.vals[k])&&correct(ow))solveWord(ow);}
  const aw=activeWord();if(aw&&P.solved[aw.idx]&&!P.solved.every(Boolean))selectNextWord(aw.idx);
  refresh();save();
}
function backspace(){
  if(!P||P.done)return;const w=activeWord();if(!w||P.solved[w.idx])return;const i=sel.i;
  if(P.vals[i]&&!cellSolved(i)){P.vals[i]='';P.wrong[i]=false;}
  else{const pos=w.cells.indexOf(i);for(let s=pos-1;s>=0;s--){const k=w.cells[s];if(!cellSolved(k)){sel.i=k;P.vals[k]='';P.wrong[k]=false;break;}}}
  Sfx.del();refresh();save();
}
function useTip(){
  if(!P||P.done)return;

  const w=activeWord();if(!w||P.solved[w.idx])return;
  let i=sel.i;if(cellSolved(i)||(P.vals[i]&&!P.wrong[i])){i=w.cells.find(k=>!cellSolved(k)&&(!P.vals[k]||P.wrong[k]));}

}

function solveWord(w){
  P.solved[w.idx]=true;
  w.cells.forEach((k,j)=>{P.wrong[k]=false;tiles[k].flip=-j*.07;});
  const full=S.mode==='full',xp=full?15:10,pts=Math.round(w.w.length*10*(full?1.5:1));const c=wordCenter(w);
  P.score=(P.score||0)+pts;S.score+=pts;S.words++;
  burst(c,26);floatAt(c,'+'+pts+' punten');Sfx.good();pimJump(false);say(pick1(PRAISE)+' '+w.w+'!',2200);
  addCoins(2);addXP(xp);
  const all=P.solved.every(Boolean);
  if(all){P.done=true;const pp=P;setTimeout(()=>{if(P===pp)puzzleDone();},1100);}
  else if(pendingLevels.length)setTimeout(()=>{if(!modalOpen&&!menuOpen&&pendingLevels.length)showLevelUp(null);},1000);
}
function puzzleDone(){

  P.score=(P.score||0)+bonus;S.score+=bonus;S.starsTotal+=stars;
  const rec=P.score>(S.best||0)&&S.puzzles>1;if(P.score>(S.best||0))S.best=P.score;
  S.history=[{d:Date.now(),s:P.score,st:stars,w:P.words.length}].concat(S.history||[]).slice(0,20);
  const pp=P,score=P.score;
  tiles.forEach(t=>{if(t)t.hop=-(t.cell.r+t.cell.c)*.045;});
  for(let k=0;k<4;k++)setTimeout(()=>burst(new THREE.Vector3((Math.random()-.5)*P.W,1.2,(Math.random()-.5)*P.H),40,1.3),k*180);
  Sfx.done();pimJump(true);say('Hoera! De puzzel is klaar!',3000);save();

}

  if(st==='owned'){confirmBuy=null;if(S.eq[it.cat]!==it.key){equip(it);say(pick1(['Mooi!','Staat je goed!','Wat leuk!']),1600);}renderSheet();return;}
  if(st==='locked'){b.classList.remove('nope');void b.offsetWidth;b.classList.add('nope');say('Speel tot level '+it.lvl+'!',1800);return;}
  if(S.coins<it.price){b.classList.remove('nope');void b.offsetWidth;b.classList.add('nope');say('Je hebt nog '+(it.price-S.coins)+' munten nodig.',2000);return;}
  if(confirmBuy!==it.id){confirmBuy=it.id;Sfx.tap();renderSheet();return;}
  confirmBuy=null;S.coins-=it.price;S.bought.push(it.id);Sfx.coin();equip(it);say('Gekocht! '+it.name+'!',2000);renderSheet();
});
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{sheetCat=t.dataset.cat;confirmBuy=null;Sfx.tap();renderSheet();}));
function openSheet(){sheetOpen=true;confirmBuy=null;$('#sheet').hidden=false;renderSheet();}
function closeSheet(){sheetOpen=false;$('#sheet').hidden=true;}
$('#btnKast').addEventListener('click',()=>{Sfx.tap();sheetOpen?closeSheet():openSheet();});
$('#sheetClose').addEventListener('click',()=>{Sfx.tap();closeSheet();});

/* ================= MODALS ================= */
function openModal(html){modalOpen=true;$('#mcard').innerHTML=html;$('#modal').hidden=false;}
function closeModal(){modalOpen=false;$('#modal').hidden=true;$('#mcard').innerHTML='';}
function showComplete(stars,xp,coins,score,rec){
  const found=P.words.length;
  openModal('<h2>Puzzel klaar!</h2><div class="stars">'+ICON.star+ICON.star+ICON.star+'</div><p>Goed gedaan'+(S.name?', '+esc(S.name):'')+'! Je vond alle '+found+' woorden'+(stars===3?' zonder hulp.':'.')+'</p><div class="scorebig">'+fmt(score)+'<small>punten</small></div>'+(rec?'<span class="record">Nieuw record!</span>':'')+'<div class="rewards"><span class="rw"><span class="xpdot">XP</span>+'+xp+'</span><span class="rw">'+ICON.coin+'+'+coins+'</span></div><button class="btn primary" id="mNext">Volgende puzzel</button>');
  const ss=[...document.querySelectorAll('.stars svg')];for(let i=0;i<stars;i++)setTimeout(()=>{if(ss[i]){ss[i].classList.add('on');Sfx.star(i);}},350+i*330);
  const nb=$('#mNext');nb.focus({preventScroll:true});
  nb.onclick=()=>{closeModal();if(pendingLevels.length)showLevelUp(newPuzzle);else newPuzzle();};
}
function showLevelUp(after){
  const lvl=pendingLevels.shift();if(lvl==null){if(after)after();return;}
  const items=ITEMS.filter(it=>it.lvl===lvl);let bonus=0;if(!items.length){bonus=25;S.coins+=bonus;}
  Sfx.level();pimJump(true);burst(mascotRoot.position.clone().add(_h.set(0,2,0)),40,1.2);save();
  openModal('<div class="lvbadge">'+lvl+'</div><h2>Level '+lvl+'!</h2>'+(items.length?'<p>Nieuw in je kast:</p><div class="unlocks">'+items.map(it=>'<div class="unlock"><span class="new">Nieuw</span><span class="ithumb">'+thumbHTML(it)+'</span><b>'+it.name+'</b><button class="btn small" data-eq="'+it.id+'">Gebruiken</button></div>').join('')+'</div>':'<div class="rewards"><span class="rw">'+ICON.coin+'+'+bonus+' munten</span></div>')+'<button class="btn primary" id="mOk">'+(after?'Volgende puzzel':'Verder puzzelen')+'</button>');
  fillThumbs($('#mcard'));updateHUD();
  document.querySelectorAll('[data-eq]').forEach(b=>b.addEventListener('click',()=>{const it=ITEMS.find(x=>x.id===b.dataset.eq);if(it){equip(it);b.textContent='Aan!';b.disabled=true;}}));
  $('#mOk').onclick=()=>{closeModal();if(pendingLevels.length)showLevelUp(after);else if(after)after();};
}

/* ================= MENU: players + scoreboard ================= */
let menuTab='spelers',delArm=null,histFor=null;
function avatar(p){const col=COLORS[p.eq&&p.eq.kleur]||COLORS.geel;return '<span class="ava" style="background:'+col.body+'">'+esc((p.name||'?').charAt(0).toUpperCase())+'</span>';}
function openMenu(tab){menuOpen=true;menuTab=tab||'spelers';delArm=null;closeSheet();bubble.hidden=true;$('#menu').hidden=false;renderMenu();saveNow();}
function closeMenu(){
  menuOpen=false;$('#menu').hidden=true;
  if(P&&P.solved.every(Boolean)){if(pendingLevels.length)showLevelUp(newPuzzle);else newPuzzle();}
}
function renderMenu(){
  document.querySelectorAll('.mtabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.mt===menuTab));
  const body=$('#menuBody');let h='';
  if(menuTab==='spelers'){
    const ps=STORE.players.slice().sort((a,b)=>((b.id===STORE.last)-(a.id===STORE.last))||a.name.localeCompare(b.name,'nl'));
    if(ps.length)h+='<div class="plist">'+ps.map(p=>'<div class="prow"><button class="pcard'+(S.id===p.id?' cur':'')+'" data-play="'+p.id+'">'+avatar(p)+'<span class="pinfo"><span class="pname">'+esc(p.name)+'</span><span class="pmeta">Level '+p.level+' · '+fmt(p.score)+' punten</span></span><span class="pgo">'+ICON.play+'</span></button><button class="pdel'+(delArm===p.id?' sure':'')+'" data-del="'+p.id+'" aria-label="'+esc(p.name)+' verwijderen">'+(delArm===p.id?'Weg?':ICON.trash)+'</button></div>').join('')+'</div>';
    h+='<form class="newp" id="newForm" autocomplete="off"><label for="pname">'+(ps.length?'Nieuwe speler':'Hoe heet jij?')+'</label><div class="row"><input id="pname" maxlength="14" placeholder="Typ je naam" enterkeyhint="go" spellcheck="false"><button class="btn primary" type="submit">Start</button></div><p class="err" id="perr"></p></form>';
    if(S.id)h+='<div class="menu-foot"><button class="btn" id="mBack" type="button">Verder met de puzzel</button></div>';
  }else{
    const ps=STORE.players.slice().sort((a,b)=>b.score-a.score);
    if(!ps.length){body.innerHTML='<p class="empty">Nog geen spelers. Maak eerst een speler aan bij Spelers.</p>';return;}
    if(!histFor||!ps.find(p=>p.id===histFor))histFor=S.id||ps[0].id;
    const hp=ps.find(p=>p.id===histFor);
    h+='<div class="board-list">'+ps.map((p,i)=>'<button class="srow'+(p.id===histFor?' cur':'')+'" data-hist="'+p.id+'"><span class="medal'+(i<3?' m'+(i+1):'')+'">'+(i+1)+'</span><span class="sname">'+esc(p.name)+'<small>Level '+p.level+' · '+p.puzzles+' puzzels · '+p.words+' woorden</small></span><span class="sstars">'+ICON.star+p.starsTotal+'</span><span class="sscore">'+fmt(p.score)+'</span></button>').join('')+'</div>';
    const hist=(hp.history||[]).slice(0,10);
    h+='<div class="hist"><h3>Laatste puzzels van '+esc(hp.name)+'</h3>'+(hist.length?hist.map(x=>'<div class="hrow"><span>'+new Date(x.d).toLocaleDateString('nl-NL',{day:'numeric',month:'short'})+'</span><span class="hst">'+[0,1,2].map(k=>ICON.star.replace('<svg','<svg class="'+(k<x.st?'on':'')+'"')).join('')+'</span><b>'+fmt(x.s)+'</b></div>').join(''):'<p class="empty">Nog geen puzzel af. Speel er een!</p>')+(hp.best?'<p class="pmeta">Beste puzzel: <b>'+fmt(hp.best)+' punten</b></p>':'')+'</div>';
  }
  body.innerHTML=h;
}
function loadPuzzle(){
  P=null;const cur=S.cur;
  if(cur&&cur.cells&&cur.words&&cur.words.length){try{P=makePuzzle(cur);if(P.solved.every(Boolean))P=null;}catch(e){P=null;}}
  if(P)return true;
  const def=generate(S.level);S.recent=(S.recent||[]).concat(def.words.map(w=>w.w)).slice(-70);P=makePuzzle(def);return false;
}
function activate(anim){
  applyMascot();const resumed=loadPuzzle();sel={i:-1,dir:'h'};
  buildBoard();applyWorld();fit();
  const fo=P.order.find(wi=>!P.solved[wi]);selectWord(fo!=null?fo:P.order[0]);
  if(anim&&!resumed)tiles.forEach(t=>{if(t)t.drop=-(t.cell.r+t.cell.c)*.035;});
  updateHUD();return resumed;
}
function startAs(p,isNew){
  if(S.id===p.id){closeMenu();say('Welkom terug, '+p.name+'!',2400);return;}
  if(S.id)saveNow();
  S=p;STORE.last=p.id;pendingLevels=[];closeModal();
  activate(true);closeMenu();
  say(isNew?'Hoi '+p.name+'! Ik ben Pim. Tik op een plaatje en maak het woord.':'Hoi '+p.name+'! Fijn dat je er weer bent.',isNew?5500:3000);
  saveNow();
}
function removePlayer(id){
  STORE.players=STORE.players.filter(p=>p.id!==id);delArm=null;if(STORE.last===id)STORE.last=null;
  if(S.id===id){S=merge({});updateHUD();}
  Sfx.del();saveNow();renderMenu();
}
$('#menuBody').addEventListener('click',e=>{
  const play=e.target.closest('[data-play]'),del=e.target.closest('[data-del]'),hist=e.target.closest('[data-hist]');
  if(play){const p=STORE.players.find(x=>x.id===play.dataset.play);if(p){Sfx.tap();startAs(p);}return;}
  if(del){const id=del.dataset.del;if(delArm!==id){delArm=id;Sfx.tap();renderMenu();return;}removePlayer(id);return;}
  if(hist){histFor=hist.dataset.hist;Sfx.tap();renderMenu();return;}
  if(e.target.closest('#mBack')){Sfx.tap();closeMenu();}
});
$('#menuBody').addEventListener('submit',e=>{
  e.preventDefault();const inp=$('#pname'),err=$('#perr');const name=inp.value.replace(/\s+/g,' ').trim();
  if(!name){err.textContent='Typ eerst je naam.';inp.focus();return;}
  if(STORE.players.some(p=>p.name.toLowerCase()===name.toLowerCase())){err.textContent='Die naam bestaat al. Tik op je naam hierboven.';return;}
  const p=merge({});p.id=newId();p.name=name;p.created=Date.now();STORE.players.push(p);
  if(document.activeElement)document.activeElement.blur();
  Sfx.init();Sfx.equip();startAs(p,true);
});
document.querySelectorAll('.mtabs button').forEach(b=>b.addEventListener('click',()=>{menuTab=b.dataset.mt;delArm=null;Sfx.tap();renderMenu();}));

/* ================= LOOP ================= */
let last=performance.now(),T=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
  for(const t of tiles){if(!t)continue;
    t.y+=(t.ty-t.y)*Math.min(1,dt*12);let y=t.y,rx=0,rz=0,s=1;
    if(t.drop!=null){t.drop+=dt;const p=clamp(t.drop/.55,0,1);y+=(1-backOut(p))*3;t.g.visible=t.drop>0;if(p>=1){t.drop=null;t.g.visible=true;}}
    if(t.pop>=0){t.pop+=dt;const p=t.pop/.28;if(p>=1)t.pop=-1;else s=1+.2*Math.sin(p*Math.PI);}
    if(t.flip!=null){t.flip+=dt;const p=t.flip/.55;if(p>=1)t.flip=null;else if(p>0){rx=ease(p)*Math.PI*2;y+=.5*Math.sin(p*Math.PI);}}
    if(t.wig>=0){t.wig+=dt;if(t.wig>.55)t.wig=-1;else rz=.2*Math.sin(t.wig*38)*(1-t.wig/.55);}
    if(t.hop!=null){t.hop+=dt;const p=t.hop/.5;if(p>=1)t.hop=null;else if(p>0)y+=.7*Math.sin(p*Math.PI);}
    t.g.position.y=BASE_H+t.h/2+y;t.g.rotation.x=rx;t.g.rotation.z=rz;t.g.scale.setScalar(s);
  }
  for(const c of coinObjs){if(c.t<0){c.obj.rotation.y+=dt*2.4;c.obj.position.y=BASE_H+FH+.45+Math.sin(T*2+c.ci)*.06;}else if(c.obj.parent){c.t+=dt;c.obj.position.y+=dt*3;c.obj.rotation.y+=dt*14;c.obj.scale.setScalar(Math.max(.01,1-c.t*1.6));if(c.t>.6){boardGroup.remove(c.obj);disposeObj(c.obj);}}}
  updateConf(dt);
  if(pim){const st=pimSt;st.time+=dt;let y=Math.sin(st.time*2.2)*.025,spin=0,rz=0;
    pim.scale.set(1+Math.sin(st.time*2.2)*.012,1-Math.sin(st.time*2.2)*.012,1);
    if(st.jumpT>=0){st.jumpT+=dt;const d=st.spin?.8:.5,p=st.jumpT/d;if(p>=1)st.jumpT=-1;else{y+=(st.spin?1.1:.6)*Math.sin(p*Math.PI);if(st.spin)spin=ease(p)*Math.PI*2;}}
    if(st.shakeT>=0){st.shakeT+=dt;if(st.shakeT>.6)st.shakeT=-1;else rz=.16*Math.sin(st.shakeT*30)*(1-st.shakeT/.6);}
    let look=0;const t=tiles[sel.i];if(t){const ang=Math.atan2(t.x-mascotRoot.position.x,t.z-mascotRoot.position.z);let d=ang-mascotRoot.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));look=clamp(d,-.7,.7);}
    st.look+=(look-st.look)*Math.min(1,dt*4);
    pimHolder.position.y=.38+y;pimHolder.rotation.y=st.look+spin;pimHolder.rotation.z=rz;
    st.blink-=dt;let es=1;if(st.blink<0){es=.12;if(st.blink<-.13)st.blink=2+Math.random()*3;}
    pim.userData.eyes.forEach(e=>e.scale.y=es);
    const flap=st.jumpT>=0?Math.sin(st.time*30)*.5:Math.sin(st.time*3)*.05;pim.userData.wings.forEach(w=>{w.rotation.z=w.userData.s*(.35+flap);});
  }
  worldTick(T,dt);
  if(!bubble.hidden){if(now>bubbleUntil)bubble.hidden=true;else placeBubble();}
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}

/* ================= BOOT ================= */
let booted=false;
function boot(data){
  if(booted)return;booted=true;
  if(data&&data.store&&Array.isArray(data.store.players))STORE={players:data.store.players.map(p=>merge(p)),last:data.store.last||null,mute:!!data.store.mute};
  else loadStore();
  const lastP=STORE.players.find(p=>p.id===STORE.last)||null;
  S=lastP||merge({});
  activate(true);
  openMenu('spelers');
  try{new ResizeObserver(()=>fit()).observe(stage);}catch(e){window.addEventListener('resize',fit);}
  if(document.fonts&&document.fonts.load){Promise.all([document.fonts.load('700 64px Andika'),document.fonts.load('800 20px Grandstander')]).then(()=>{redrawAll();fit();}).catch(()=>{});}
  requestAnimationFrame(frame);
}
let hot=null;try{hot=window.claude&&window.claude.hot;}catch(e){}
try{if(hot&&typeof hot.snapshot==='function')hot.snapshot(()=>({store:snapshot()}));}catch(e){}
if(hot&&typeof hot.ready==='function'){try{hot.ready(d=>boot(d||{}));}catch(e){boot({});}setTimeout(()=>boot({}),1500);}
else boot((hot&&hot.data)||{});
})();
</script>
